name: Infrastructure Deploy
on:
  push:
    paths:
      - 'infra/**'
    branches: [ main ]
  workflow_dispatch: # Дозволяє запускати вручну кнопкою

jobs:
  terraform-apply:
    runs-on: self-hosted # ВАЖЛИВО: виконується на твоєму Celeron
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd infra
          terraform init

      - name: Terraform Apply
        run: |
          cd infra
          # -auto-approve дозволяє не вводити "yes" вручну
          terraform apply -auto-approve